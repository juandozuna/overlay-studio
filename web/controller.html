<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Overlay Studio • Remote</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#111620;color:#eef4ff}*{box-sizing:border-box}body{margin:0;padding:24px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left));max-width:1000px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}h1{font-size:22px;margin:0}small{color:#adbbd0}#connection{font-size:13px;color:#b3c2db}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:20px 0 12px}.team{background:#1b2535;border-top:4px solid var(--team);border-radius:14px;padding:14px;text-align:center}.team strong{display:block;font-size:42px;font-variant-numeric:tabular-nums}.team span{font-size:13px;overflow-wrap:anywhere}.clocks{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.clock{background:#1b2535;border-radius:10px;padding:10px 14px;font-variant-numeric:tabular-nums}.clock strong{font-size:22px}.clock span{display:block;font-size:11px;color:#adbbd0}#round,#wheel-winner{display:block;font-size:12px;color:#b3c2db}#wheel-winner{margin-top:4px;font-weight:600}#controls{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:44px;gap:10px}button{border:1px solid #ffffff22;border-radius:12px;font-family:inherit;font-weight:600;font-size:17px;line-height:1.25;color:white;min-height:44px;padding:12px;touch-action:manipulation;overflow-wrap:anywhere;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:active{filter:brightness(1.25)}button:focus-visible{outline:3px solid #92c9ff;outline-offset:3px}#message{min-height:24px;margin-top:16px;font-size:14px;color:#f1cba1}#outputs{font-size:12px;color:#adbbd0;display:flex;flex-direction:column;gap:5px;margin-top:22px}dialog{background:#1b2535;color:#eef4ff;border:1px solid #61738f;border-radius:16px;max-width:90%;padding:24px}dialog::backdrop{background:#0009}dialog div{display:flex;gap:12px;margin-top:22px}dialog button{background:#236584;flex:1}@media(max-width:400px){body{padding-top:18px}.scores{gap:8px}.team{padding:10px 8px}.team strong{font-size:34px}button{font-size:15px;padding:8px}#controls{gap:8px}}
</style><script src="/controller.js" defer></script></head>
<body><header><div><small>OVERLAY STUDIO</small><h1 id="project">Remote controller</h1></div><span id="connection" role="status">Connecting…</span></header>
<section id="teams" class="scores" aria-label="Live game values"></section><section id="clocks" class="clocks" aria-label="Clocks"></section><span id="round">Round —</span><span id="wheel-winner" hidden></span>
<h2 id="layout-name" style="font-size:14px;color:#adbbd0;font-weight:500">Game controls</h2><main id="controls" aria-label="Custom control layout"></main><div id="message" role="status" aria-live="polite"></div><footer id="outputs"></footer>
<dialog id="confirm"><p id="confirm-label"></p><div><button id="cancel">Cancel</button><button id="proceed">Confirm</button></div></dialog>
</body></html>
